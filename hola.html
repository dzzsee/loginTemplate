<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bienvenido</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Fondo base negro coherente -->
    <div style="position:fixed;inset:0;background:#0a0a0c;z-index:-1"></div>

    <main class="card card--success" style="
      max-width: 480px;
      padding: 80px 40px;
      text-align: center;
    ">
      <div style="width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; background: var(--accent); box-shadow: 0 8px 20px -6px var(--accent-soft); display: grid; place-items: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" style="color: #0a0a0c;">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.5" fill="none" />
          <circle cx="12" cy="7" r="3" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </div>

      <h1 style="margin: 0 0 16px; font-size: 2rem; line-height: 1.15; letter-spacing: var(--tracking-title); font-weight: 700;">Hola mundo</h1>

      <p style="margin: 0 0 24px; color: var(--text-secondary); font-size: 1.05rem;">
        Has iniciado sesión correctamente.
      </p>

      <button
        class="button"
        style="
          margin: 0 auto;
          padding: 12px 32px;
          font-size: 1rem;
          font-weight: 600;
          background: var(--accent);
          color: #0a0a0c;
          border: none;
          border-radius: var(--radius-button);
          cursor: pointer;
          transition: background var(--duration-fast) var(--ease),
                      transform var(--duration-fast) var(--ease);
        "
        onclick="window.location.href='index.html'"
      >
        <span class="button__label">Cerrar sesión</span>
        <span class="button__spinner" aria-hidden="true" style="
          width: 18px;
          height: 18px;
          border: 2px solid rgba(255, 255, 255, 0.4);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
          display: none;
        "></span>
      </button>

      <p class="form__footer" style="margin: 32px 0 0; font-size: 0.88rem; color: var(--text-secondary);">
        <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Volver al login</a>
      </p>
    </main>

    <script>
      // Pequeña animación de entrada para la card en hola.html
      document.addEventListener("DOMContentLoaded", () => {
        const card = document.querySelector(".card--success");
        if (card) {
          card.style.opacity = "0";
          card.style.transform = "translateY(20px)";
          card.style.transition = "opacity 0.4s cubic-bezier(0.28,0.44,0.49,1), transform 0.4s cubic-bezier(0.28,0.44,0.49,1)";
          window.setTimeout(() => {
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";
          }, 100);
        }
      });
    </script>
  </body>
</html>

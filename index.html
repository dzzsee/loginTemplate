<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Fondo decorativo: dos "manchas" de luz difuminadas.
    Son puramente estéticas y viven detrás de la tarjeta (z-index bajo).
  -->
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop__orb backdrop__orb--1"></span>
    <span class="backdrop__orb backdrop__orb--2"></span>
  </div>

  <!--
    Tarjeta principal.
    `.card` es una superficie de "vidrio" translúcido: tiene blur, borde
    luminoso y sombra suave. Contiene todo el formulario de login.
  -->
  <main class="card">

    <!-- Cabecera: marca + título + subtítulo. Reemplaza los textos aquí. -->
    <header class="card__header">
      <div class="card__brand" aria-hidden="true">
        <!-- Icono / logo. Cambia el SVG o coloca tu marca. -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </div>
      <h1 class="card__title">Bienvenido de nuevo</h1>
      <p class="card__subtitle">Inicia sesión para continuar</p>
    </header>

    <!--
      Formulario.
      - `novalidate`: desactivamos la validación nativa del navegador para
        mostrar nuestros propios mensajes (más consistentes y accesibles).
      - `data-login-form`: el hook que usa script.js para encontrar el form.
    -->
    <form class="form" data-login-form novalidate>

      <!-- Campo de email -->
      <div class="field">
        <label class="field__label" for="email">Correo electrónico</label>
        <input
          class="field__input"
          type="email"
          id="email"
          name="email"
          placeholder="tu@correo.com"
          autocomplete="email"
          inputmode="email"
          required
          aria-describedby="email-error"
        />
        <!-- Mensaje de error: vacío por defecto, lo rellena script.js -->
        <p class="field__error" id="email-error" aria-live="polite"></p>
      </div>

      <!-- Campo de contraseña -->
      <div class="field">
        <!-- Fila de label + enlace "olvidé contraseña" (proximidad = relación) -->
        <div class="field__labelrow">
          <label class="field__label" for="password">Contraseña</label>
          <a class="field__link" href="#recuperar">¿Olvidaste tu contraseña?</a>
        </div>

        <!--
          Contenedor del input + botón de mostrar/ocultar contraseña.
          El botón cambia el atributo `type` entre "password" y "text".
        -->
        <div class="field__control">
          <input
            class="field__input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="field__toggle"
            data-toggle-password
            aria-label="Mostrar contraseña"
            aria-pressed="false"
          >
            <!-- Icono del ojo, se alterna con .field__toggle--visible -->
            <svg class="eye eye--open" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.6" />
            </svg>
            <svg class="eye eye--closed" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 3l18 18M10.5 5.2A10 10 0 0 1 12 5c6.5 0 10 6 10 6a17 17 0 0 1-2 2.6M6.5 6.5C4 7.8 2.5 10 2.5 10s3.5 6 10 6a9 9 0 0 0 2 0M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <p class="field__error" id="password-error" aria-live="polite"></p>
      </div>

      <!-- Opciones: recordar sesión -->
      <label class="check">
        <input class="check__input" type="checkbox" name="remember" />
        <span class="check__box" aria-hidden="true"></span>
        <span class="check__text">Recordarme</span>
      </label>

      <!-- Botón de envío -->
      <button class="button" type="submit" data-submit>
        <span class="button__label">Iniciar sesión</span>
        <!-- Spinner de carga, visible durante el envío -->
        <span class="button__spinner" aria-hidden="true"></span>
      </button>

      <!-- Pie: aún no tienes cuenta -->
      <p class="form__footer">
        ¿No tienes una cuenta? <a class="form__link" href="#registro">Regístrate</a>
      </p>

      <!-- Mensaje global de estado (éxito/error de envío) -->
      <p class="form__status" data-login-status aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
